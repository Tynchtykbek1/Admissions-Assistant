<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions RAG Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Admissions RAG Assistant</p>
            <h1>Ask questions about an admissions document</h1>
            <p>Upload one TXT or PDF file, then ask as many questions as you need.</p>
        </header>

        <section class="card">
            <h2>1. Upload a document</h2>
            <div class="row">
                <input id="document-file" type="file" accept=".txt,.pdf">
                <button id="upload-button" type="button">Upload</button>
            </div>
            <p id="upload-status" class="status">No document uploaded yet.</p>
            <div id="current-document" class="document-info" hidden>
                <strong>Current document:</strong> <span id="current-filename"></span>
                <span>Chunks: <span id="current-chunks"></span></span>
            </div>
        </section>

        <section class="card">
            <h2>2. Ask a question</h2>
            <label for="question">Question</label>
            <textarea id="question" rows="4" placeholder="What is the application deadline?"></textarea>

            <label for="answer-mode">Answer mode</label>
            <select id="answer-mode">
                <option value="semantic">Semantic</option>
                <option value="llm">LLM</option>
            </select>

            <button id="ask-button" type="button">Ask</button>
            <p id="ask-status" class="status"></p>
        </section>

        <section id="response-section" class="card" hidden>
            <h2>Answer</h2>
            <p id="answer" class="answer"></p>
            <h3>Sources</h3>
            <div id="sources"></div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
